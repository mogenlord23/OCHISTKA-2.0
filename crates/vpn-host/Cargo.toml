[package]
name = "vpn-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Служба Windows «OchistkaVpn»: держит VPN-ядро sing-box (туннель на весь компьютер) от имени системы.
[[bin]]
name = "ochistka-vpn-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services"] }
