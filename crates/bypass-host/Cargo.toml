[package]
name = "bypass-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Служба Windows «OchistkaBypass»: запускает ochistkadpi.exe (рядом с этим файлом) и останавливает его.
[[bin]]
name = "ochistka-bypass-host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services"] }
