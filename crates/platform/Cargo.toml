[package]
name = "ochistka-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

# libclamav встраивается только при сборке с этой фичей (нужны заголовки и библиотека ClamAV).
[features]
default = []
libclamav = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
netstat2 = "0.11.2"
ochistka-core = { path = "../ochistka-core" }
serde_json = "1"
sysinfo = "0.40.4"
tract-onnx = { version = "=0.23.10", default-features = false }
url = "2"

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

# Реестр Windows: только чтение, только под Windows (безопасная обёртка над WinAPI).
[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-icons = "0.4.0"
winreg = "0.56.0"
# Вызовы Win32 живут только в src/windows/win32_ffi.rs.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Services", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }
# Модели дисков (Win32_DiskDrive), только чтение; безопасная обёртка над WMI.
serde = { version = "1", features = ["derive"] }
wmi = "0.18.4"
# Загрузка установщиков драйверов (блокирующий клиент, TLS системы Windows).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Также загрузка подписки VPN.
