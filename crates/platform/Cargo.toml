[package]
name = "ochistka-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

# libclamav встраивается только при сборке с этой фичей (нужны заголовки и библиотека ClamAV).
[features]
default = []
libclamav = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
netstat2 = "0.11.2"
ochistka-core = { path = "../ochistka-core" }
sysinfo = "0.40.4"

# Реестр Windows: только чтение, только под Windows (безопасная обёртка над WinAPI).
[target.'cfg(windows)'.dependencies]
wallpaper = "3.2.0"
windows-icons = "0.4.0"
winreg = "0.56.0"
# Модели дисков (Win32_DiskDrive), только чтение; безопасная обёртка над WMI.
serde = { version = "1", features = ["derive"] }
wmi = "0.18.4"

# Загрузка подписки VPN: HTTPS через системный SChannel (без C-зависимостей, доверяет хранилищу Windows).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
