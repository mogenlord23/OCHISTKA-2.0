[package]
name = "ochistka-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

# libclamav встраивается только при сборке с этой фичей (нужны заголовки и библиотека ClamAV).
[features]
default = []
libclamav = []

[dependencies]
netstat2 = "0.11.2"
ochistka-core = { path = "../ochistka-core" }
sysinfo = "0.40.4"

# Реестр Windows: только чтение, только под Windows (безопасная обёртка над WinAPI).
[target.'cfg(windows)'.dependencies]
windows-icons = "0.4.0"
winreg = "0.56.0"
