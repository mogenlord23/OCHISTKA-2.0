[package]
name = "ochistka-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ochistka_desktop_lib"

[[bin]]
name = "ochistka-desktop"
path = "src/main.rs"

[features]
# Настоящий движок ClamAV из официальной сборки (tools/clamav-win/fetch.ps1). См. ADR 0004.
# Включён по умолчанию: build.rs подключает его, только если сборка скачана, иначе остаётся
# честная заглушка «движок не собран» без ошибки линковки.
default = ["libclamav"]
libclamav = ["ochistka-platform/libclamav"]

[dependencies]
ochistka-core = { path = "../../../crates/ochistka-core" }
ochistka-platform = { path = "../../../crates/platform" }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.6", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2.7"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
