[package]
name = "ochistka-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ochistka_desktop_lib"

[[bin]]
name = "ochistka-desktop"
path = "src/main.rs"

[dependencies]
ochistka-core = { path = "../../../crates/ochistka-core" }
ochistka-platform = { path = "../../../crates/platform" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.6"

[build-dependencies]
tauri-build = "2.7.5"
