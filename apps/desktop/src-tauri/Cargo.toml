[package]
name = "ochistka-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ochistka_desktop_lib"

[[bin]]
name = "ochistka-desktop"
path = "src/main.rs"

[features]
default = []
# Настоящий движок ClamAV из официальной сборки (tools/clamav-win/fetch.ps1). См. ADR 0004.
libclamav = ["ochistka-platform/libclamav"]

[dependencies]
ochistka-core = { path = "../../../crates/ochistka-core" }
ochistka-platform = { path = "../../../crates/platform" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.6", features = ["image-png"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[target.'cfg(windows)'.dependencies]
rfd = "0.18.0"
