# Reproducible, manual-only OFFLINE verification of already-imported sources.
# Initial immutable-source import completed on 2026-11-21; no network, no driver.
name: verify-desync-preset-resources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test complete original preset resource inventory (offline)
        run: python3 -m unittest discover -s tools/desync-core -p 'test_preset_runtime_assets.py' -q
      - name: Verify SHA-256 and Git identity of 135 committed files (offline)
        run: python3 tools/desync-core/preset_runtime_assets.py verify
