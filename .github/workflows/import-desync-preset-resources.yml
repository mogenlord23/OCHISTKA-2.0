# One-time, byte-for-byte import of the pinned real NetZapret preset resources.
# No DPI, no driver, no Windows network configuration and no executable launch.
name: import-desync-preset-resources

on:
  workflow_dispatch:
  push:
    branches:
      - claude/epic-knuth-0zhg19
    paths:
      - .github/workflows/import-desync-preset-resources.yml

permissions:
  contents: write

jobs:
  import-pinned-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Test source map and importer locally (no network)
        run: python3 -m unittest discover -s tools/desync-core -p 'test_preset_runtime_assets.py' -q
      - name: Import immutable GitHub snapshot and verify every original Git blob
        run: python3 tools/desync-core/preset_runtime_assets.py import
      - name: Verify exact SHA-256 of all 135 files offline
        run: python3 tools/desync-core/preset_runtime_assets.py verify
      - name: Commit verified resources only on the working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/desync/runtime/ docs/status/desync-preset-resources.json
          git diff --cached --quiet && { echo 'Expected pinned resources are missing'; exit 1; }
          git commit -m 'feat(desync): vendor 135 SHA-256-pinned NetZapret preset resources'
          git push origin HEAD:refs/heads/claude/epic-knuth-0zhg19
