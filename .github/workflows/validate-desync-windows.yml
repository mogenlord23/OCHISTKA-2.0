# Проверка настоящего Windows-движка и кандидата TCP-профиля в режимах
# --dry-run и --intercept=0. WinDivert инициализируется даже в режиме
# --intercept=0, поэтому проверка ограничена исходящим TCP на локальный порт 9.
# Нет штатного захвата веб-трафика, изменения настроек ОС или повторной сборки.
name: validate-desync-windows

on:
  push:
    branches:
      - claude/epic-knuth-0zhg19
    paths:
      - crates/ochistka-core/src/desync.rs
      - crates/platform/src/desync.rs
      - assets/desync/**
      - .github/workflows/validate-desync-windows.yml

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release and candidate profile without packet interception
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mogenlord23/OCHISTKA-2.0/releases/download/zapret2-winws2-2026-11-21/zapret2-winws2-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile zapret2-verified.zip -UseBasicParsing
          $actual = (Get-FileHash zapret2-verified.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '15bb46aca6904c674cb018250855398c60d7676079fd534832f1e4d87f07e04a'
          if ($actual -ne $expected) { throw "Release ZIP SHA-256 mismatch" }
          Expand-Archive zapret2-verified.zip -DestinationPath verified-winws2
          foreach ($file in @('winws2.exe', 'cygwin1.dll', 'cygz.dll', 'WinDivert.dll', 'WinDivert64.sys')) {
            if (-not (Test-Path "verified-winws2/$file")) { throw "Missing: $file" }
          }
          # Оригинальные Lua-файлы именно из нашей закреплённой upstream-ревизии.
          Copy-Item assets/desync/zapret-lib.lua verified-winws2/
          Copy-Item assets/desync/zapret-antidpi.lua verified-winws2/
          Push-Location verified-winws2
          try {
            & .\winws2.exe --version
            if ($LASTEXITCODE -ne 0) { throw "winws2.exe --version exited with code $LASTEXITCODE" }

            # Точная копия первого экспериментального TCP-профиля из
            # ochistka-core::desync::windows_tcp_candidate_profile().
            # --dry-run проверяет параметры и наличие файлов без запуска драйвера.
            # --intercept=0 выполняет Lua init, но в Windows всё равно
            # инициализирует WinDivert; поэтому задаём строгий raw-фильтр
            # только для 127.0.0.1:9, не допуская перехвата обычного трафика.
            # По upstream --wf-raw переопределяет конструктор --wf-tcp-out.
            $candidate = @(
              '--wf-tcp-out=80,443'
              '--lua-init=@zapret-lib.lua'
              '--lua-init=@zapret-antidpi.lua'
              '--filter-tcp=80,443'
              '--filter-l7=tls,http'
              '--payload=tls_client_hello'
              '--lua-desync=fake:blob=fake_default_tls:tcp_md5:tls_mod=rnd,rndsni,dupsid'
              '--payload=http_req'
              '--lua-desync=fake:blob=fake_default_http:tcp_md5'
              '--payload=tls_client_hello,http_req'
              '--lua-desync=multisplit:pos=1:seqovl=5:seqovl_pattern=0x1603030000'
            )
            & .\winws2.exe --dry-run @candidate
            if ($LASTEXITCODE -ne 0) { throw "TCP candidate --dry-run failed: $LASTEXITCODE" }
            $restricted = '--wf-raw=outbound and tcp.DstPort == 9 and ip.DstAddr == 127.0.0.1'
            & .\winws2.exe --intercept=0 --debug=1 $restricted @candidate
            if ($LASTEXITCODE -ne 0) { throw "TCP candidate Lua init/WinDivert restricted smoke failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Rust Windows-only desync tests (no packet interception)
        shell: pwsh
        run: |
          cargo test -p ochistka-core -p ochistka-platform desync --lib
          if ($LASTEXITCODE -ne 0) { throw "Windows desync tests failed" }
