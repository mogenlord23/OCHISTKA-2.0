# Проверка службы обхода на настоящем Windows (windows-2022, права администратора есть в раннере):
# собрать службу, поставить ТЕМ ЖЕ скриптом, что и установщик, запустить, проверить SERVICE_RUNNING
# через 5 секунд, остановить, проверить SERVICE_STOPPED, удалить. Логи — в артефакт.
# Запускается только вручную (Actions → Run workflow). Автозапуска при push нет.
name: windows-service-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the service host
        shell: pwsh
        run: |
          cargo build --release --locked -p bypass-host
          if ($LASTEXITCODE -ne 0) { throw 'bypass-host build failed' }

      - name: Install, start, check, stop, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logDir = Join-Path $env:GITHUB_WORKSPACE 'service-check-logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $log = Join-Path $logDir 'service-check.log'
          function Log([string]$m) { $line = "{0:HH:mm:ss}  {1}" -f (Get-Date), $m; Write-Host $line; Add-Content -Path $log -Value $line }
          $sc = Join-Path $env:SystemRoot 'System32\sc.exe'
          $name = 'OchistkaBypass'
          $failures = @()
          function State([string]$n) { $o = & $sc query $n 2>&1 | Out-String; if ($LASTEXITCODE -ne 0) { return 'NOT_INSTALLED' }; if ($o -match 'STATE\s*:\s*\d+\s+(\w+)') { return $Matches[1] }; return 'UNKNOWN' }
          function WaitState([string]$n, [string]$want, [int]$sec) { for ($i = 0; $i -lt $sec * 4; $i++) { if ((State $n) -eq $want) { return $true }; Start-Sleep -Milliseconds 250 }; return $false }

          $stage = Join-Path $env:RUNNER_TEMP 'ochistka-service'
          try {
            Log 'Файлы: скачивание и проверка SHA-256'
            & "$env:GITHUB_WORKSPACE/scripts/windows/fetch-ochistkadpi.ps1" -Destination $stage *>&1 | Tee-Object -FilePath $log -Append
            Copy-Item target/release/ochistka-bypass-host.exe (Join-Path $stage 'ochistka-bypass-host.exe')
            Copy-Item apps/desktop/src-tauri/resources/ochistkadpi/bypass-service.ps1 (Join-Path $stage 'bypass-service.ps1')

            Log 'Установка службы (тот же скрипт, что в установщике)'
            & (Join-Path $stage 'bypass-service.ps1') -Action install -InstallDir $stage *>&1 | Tee-Object -FilePath $log -Append
            $state = State $name
            Log "После установки: $state"
            if ($state -ne 'STOPPED') { $failures += "после установки состояние $state, ожидалось STOPPED" }
            $sd = (& $sc sdshow $name | Out-String).Trim()
            Log "Права службы: $sd"
            if ($sd -notmatch ';;;AU\)') { $failures += 'в правах службы нет записи для обычных пользователей (AU)' }
            $qc = (& $sc qc $name | Out-String)
            Log $qc
            if ($qc -notmatch 'DEMAND_START') { $failures += 'тип запуска не «вручную»' }

            Log 'Запуск службы'
            & $sc start $name *>&1 | Tee-Object -FilePath $log -Append
            Start-Sleep -Seconds 5
            $state = State $name
            Log "Через 5 секунд: $state"
            Log ((& $sc query $name | Out-String))
            Log ('WinDivert: ' + (State 'WinDivert'))
            Log ('Процесс ochistkadpi: ' + [bool](Get-Process -Name ochistkadpi -ErrorAction SilentlyContinue))
            if ($state -ne 'RUNNING') { $failures += "через 5 секунд состояние $state, ожидалось RUNNING" }

            Log 'Остановка службы'
            & $sc stop $name *>&1 | Tee-Object -FilePath $log -Append
            $stopped = WaitState $name 'STOPPED' 20
            Log "STOPPED достигнуто: $stopped"
            if (-not $stopped) { $failures += 'служба не достигла STOPPED за 20 секунд' }
            Start-Sleep -Seconds 2
            $driver = State 'WinDivert'
            Log "WinDivert после остановки: $driver"
            if ($driver -eq 'RUNNING') { $failures += 'драйвер WinDivert остался запущенным' }
            if (Get-Process -Name ochistkadpi -ErrorAction SilentlyContinue) { $failures += 'процесс ochistkadpi остался' }
          }
          catch { $failures += "исключение: $($_.Exception.Message)"; Log ($_ | Out-String) }
          finally {
            Log 'Удаление службы'
            try { & (Join-Path $stage 'bypass-service.ps1') -Action uninstall -InstallDir $stage *>&1 | Tee-Object -FilePath $log -Append } catch { Log ($_ | Out-String) }
            $after = State $name
            Log "После удаления: $after"
            if ($after -ne 'NOT_INSTALLED') { $failures += "после удаления состояние $after" }
            $event = Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'OCHISTKA|Ochistka|WinDivert' } | ForEach-Object { $_.TimeCreated.ToString('HH:mm:ss') + '  ' + $_.Message }
            if ($event) { Set-Content -Path (Join-Path $logDir 'scm-events.txt') -Value $event }
          }
          if ($failures.Count -gt 0) {
            Log ('ОШИБКИ: ' + ($failures -join '; '))
            Set-Content -Path (Join-Path $logDir 'RESULT.txt') -Value ('FAILED: ' + ($failures -join '; '))
            exit 1
          }
          Log 'ВСЁ ПРОШЛО'
          Set-Content -Path (Join-Path $logDir 'RESULT.txt') -Value 'PASSED'
          # Код выхода шага берётся от последней внешней программы (sc.exe мог вернуть 1062): сбрасываем.
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-check-logs
          path: service-check-logs/*
          if-no-files-found: warn
