# Проверка Rust-кода и безопасного offline-инструмента; сетевых тестов нет.
name: validate-desync-pin

on:
  push:
    branches:
      - claude/epic-knuth-0zhg19
    paths:
      - crates/ochistka-core/src/desync.rs
      - crates/ochistka-core/src/desync/**
      - crates/platform/src/desync.rs
      - crates/platform/src/desync/**
      - assets/desync/**
      - tools/desync-core/external_dpi_probe.py
      - tools/desync-core/test_external_dpi_probe.py
      - tools/desync-core/ochistka_dpi_check.py
      - tools/desync-core/preset_runtime_assets.py
      - tools/desync-core/test_preset_runtime_assets.py
      - docs/status/desync-preset-resources.json
      - tools/desync-core/test_ochistka_dpi_check.py
      - tools/desync-core/package/**
      - .github/workflows/build-desync-diagnostic-package.yml
      - .github/workflows/validate-desync-pin.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Test core and platform
        run: cargo test -p ochistka-core -p ochistka-platform --lib
      - name: Verify all pinned NetZapret resources offline
        run: python3 tools/desync-core/preset_runtime_assets.py verify
      - name: Offline external probe safety tests (no network / no driver)
        run: python3 -m unittest discover -s tools/desync-core -p 'test_*.py' -q

  windows-offline:
    # Only Python unit tests and no-op planning. Never --execute or start WinDivert.
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all pinned NetZapret resources on Windows (offline)
        shell: pwsh
        run: |
          python tools/desync-core/preset_runtime_assets.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Pinned preset asset check failed' }
      - name: Offline probe safety tests on Windows (no driver)
        shell: pwsh
        run: |
          python -m unittest discover -s tools/desync-core -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline probe tests failed on Windows' }
      - name: Plan-only mode (no network and no driver)
        shell: pwsh
        run: |
          python tools/desync-core/external_dpi_probe.py --host example.org --ip 1.1.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Offline plan-only probe failed on Windows' }
