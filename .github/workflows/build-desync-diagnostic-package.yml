# Ручная сборка самостоятельного диагностического пакета для Windows x64 (без установки Python у пользователя).
# Только офлайн-проверка пакета: перехват пакетов, драйвер и внешние соединения для проверки не используются.
# Запускается только вручную, без автоматического перехвата или внешнего DPI-теста.
name: build-desync-diagnostic-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Offline tests (no network, no driver)
        shell: pwsh
        run: |
          python -m unittest discover -s tools/desync-core -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }

      - name: Build the executable (PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onedir --console --name OCHISTKA-DPI-Check --paths tools/desync-core tools/desync-core/ochistka_dpi_check.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }

      - name: Assemble the package from the pinned Release (hashes verified)
        shell: pwsh
        run: |
          $rust = Get-Content crates/ochistka-core/src/desync.rs -Raw
          $url = [regex]::Match($rust, 'url: "(https://github\.com/mogenlord23/OCHISTKA-2\.0/releases/download/[^"]+)"').Groups[1].Value
          $sha = [regex]::Match($rust, 'archive_sha256: "([0-9a-f]{64})"').Groups[1].Value
          if (-not $url -or -not $sha) { throw 'Не найден закреплённый адрес или SHA-256 в desync.rs' }
          Invoke-WebRequest -Uri $url -OutFile release.zip -UseBasicParsing
          $got = (Get-FileHash release.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "SHA-256 архива не совпал: $got" }
          $pkg = 'dist/OCHISTKA-DPI-Check'
          New-Item -ItemType Directory -Path "$pkg/bundle", "$pkg/assets/desync" -Force | Out-Null
          Expand-Archive release.zip -DestinationPath release-x -Force
          foreach ($f in 'winws2.exe','cygwin1.dll','cygz.dll','WinDivert.dll','WinDivert64.sys','LICENSE-zapret2.txt','LICENSE-WinDivert.txt','LICENSE-luajit2.txt','manifest.json') {
            Copy-Item "release-x/$f" "$pkg/bundle/$f"
          }
          Copy-Item assets/desync/*.lua "$pkg/assets/desync/"
          Copy-Item tools/desync-core/package/README-ru.txt "$pkg/README-ru.txt"

      - name: Offline self-check of the PACKAGED executable (and a tamper test)
        shell: pwsh
        run: |
          $exe = 'dist/OCHISTKA-DPI-Check/OCHISTKA-DPI-Check.exe'
          & $exe --self-check
          if ($LASTEXITCODE -ne 0) { throw 'Self-check of the package failed' }
          # Подмена любого файла движка должна блокировать запуск.
          Copy-Item dist/OCHISTKA-DPI-Check tamper-test -Recurse
          Add-Content -Path tamper-test/bundle/cygz.dll -Value 'x'
          # PowerShell in CI treats a nonzero native exit code as a terminating error.
          # This is an EXPECTED refusal; inspect it through Start-Process instead.
          $tamperedExe = (Resolve-Path 'tamper-test/OCHISTKA-DPI-Check.exe').Path
          $tamperedProcess = Start-Process -FilePath $tamperedExe -ArgumentList '--self-check' -PassThru -Wait -NoNewWindow
          if ($tamperedProcess.ExitCode -eq 0) { throw 'Подмена файла не была обнаружена' }
          Remove-Item tamper-test -Recurse -Force

      - name: Zip, hash, report
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OCHISTKA-DPI-Check -DestinationPath OCHISTKA-DPI-Check-windows-x64.zip
          $h = (Get-FileHash OCHISTKA-DPI-Check-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "OCHISTKA-DPI-Check-windows-x64.zip SHA-256: $h" | Tee-Object -FilePath package-sha256.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Recurse dist/OCHISTKA-DPI-Check/bundle | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Add-Content package-sha256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ochistka-dpi-check-windows-x64
          path: |
            OCHISTKA-DPI-Check-windows-x64.zip
            package-sha256.txt
          if-no-files-found: error
