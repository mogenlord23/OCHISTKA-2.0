# Однократная публикация УЖЕ СОБРАННОГО артефакта; никаких компиляторов.
# Отдельно от workflow сборки winws2. Важно: публикация лишь после SHA-256 проверки.
name: publish-zapret2-prebuilt

on:
  push:
    branches:
      - claude/epic-knuth-0zhg19
    paths:
      - .github/workflows/publish-zapret2-prebuilt.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-zapret2-prebuilt
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified prebuilt ZIP
    if: github.repository == 'mogenlord23/OCHISTKA-2.0' && github.ref == 'refs/heads/claude/epic-knuth-0zhg19'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: zapret2-winws2-2026-11-21
      FILE: zapret2-winws2-windows-x64.zip
      EXPECTED_SHA256: 15bb46aca6904c674cb018250855398c60d7676079fd534832f1e4d87f07e04a
    steps:
      - name: Download EXACT artifact from successful build 44885741341
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, leaving it unchanged."
            exit 0
          fi
          curl --fail --show-error --silent --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14699987330/zip" \
            --output "$FILE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$FILE" | sha256sum --check -

      - name: Verify five binary files inside ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          path = "zapret2-winws2-windows-x64.zip"
          expected = {
              "winws2.exe": "5390cb6cec8cdb39bda657f83e8b87ce8dc96d074bf6a71e22c03c6896bcaf42",
              "cygwin1.dll": "ed9d5379061e5de79c3375cc62246c2142ea1c97d94f4d16bfbea6fb1b7fc889",
              "cygz.dll": "02561b4b4b473c40e9bed9c5df59334b5d79efae568b6e212a7c9d775ba8e647",
              "WinDivert.dll": "c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2",
              "WinDivert64.sys": "8da085332782708d8767bcace5327a6ec7283c17cfb85e40b03cd2323a90ddc2",
          }
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if not set(expected).issubset(names):
                  raise SystemExit("One or more required files are missing")
              for name, digest in expected.items():
                  actual = hashlib.sha256(archive.read(name)).hexdigest()
                  if actual != digest:
                      raise SystemExit(f"SHA-256 mismatch for {name}")
          print("ZIP and all five binary SHA-256 checks passed")
          PY

      - name: Publish prerelease from verified ZIP without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Windows x64 Zapret 2 (winws2.exe) build for OCHISTKA.
          Original GitHub Actions build: https://github.com/mogenlord23/OCHISTKA-2.0/actions/runs/44885741341
          Exact artifact ZIP SHA-256: 15bb46aca6904c674cb018250855398c60d7676079fd534832f1e4d87f07e04a
          Source commits are pinned in the build workflow; includes dependent DLLs and licenses.
          WinDivert64.sys Authenticode signature was Valid in build verification.
          This is a prerelease of engine components, NOT a tested end-user application.
          EOF
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zapret 2 Windows x64 — OCHISTKA (verified build)" \
            --notes-file release-notes.txt \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
