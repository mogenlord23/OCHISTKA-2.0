# Ручная воспроизводимая сборка winws2.exe (Zapret 2) для Windows x64 из официальных исходников.
# Запускается ТОЛЬКО вручную (Actions -> Run workflow). При каждом push не выполняется.
# Отличия от официального процесса Zapret 2 (сделаны ради безопасности):
#   * Cygwin ставится с официального зеркала по https и С проверкой подписей пакетов
#     (в upstream: http-зеркало 2024 года и check-sig: false);
#   * все исходники берутся по git и сверяются с закреплённым полным SHA коммита;
#   * WinDivert.dll не изменяется (в upstream к нему применяется peflags), чтобы не нарушить подпись;
#   * проверяется цифровая подпись WinDivert64.sys, сверяется SHA-256 архива WinDivert.
# Результат — артефакт с файлами, manifest.json (SHA-256 каждого файла) и текстами лицензий.
# Сборка не подписывается и не скрывается от защиты Windows.
name: build-zapret2-windows

on:
  workflow_dispatch:
    inputs:
      windivert_zip_sha256:
        description: 'Ожидаемый SHA-256 архива WinDivert-2.2.2-A.zip (если пусто — только печатается, сборка помечается «не подтверждено»)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Zapret 2: коммит 1eb4fd8 (полный SHA проверяется ниже).
  ZAPRET2_COMMIT: 1eb4fd887b6091ccaf59feea7486162ac64c9319
  # openresty/luajit2, тег v2.1-20250826 (как в официальном build.yml).
  LUAJIT_TAG: v2.1-20250826
  LUAJIT_COMMIT: dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc
  # basil00/WinDivert, тег v2.2.2 (выпуск 2.2.2-A).
  WINDIVERT_TAG: v2.2.2
  WINDIVERT_COMMIT: 1789526ecfb9ff5397c94f9f54c1a3dc2fb60440

jobs:
  build:
    name: Windows x64 (Cygwin)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get Zapret 2 sources at the pinned commit
        shell: pwsh
        run: |
          git clone https://github.com/bol-van/zapret2 zapret2
          git -C zapret2 checkout --detach $env:ZAPRET2_COMMIT
          $head = (git -C zapret2 rev-parse HEAD).Trim()
          if ($head -ne $env:ZAPRET2_COMMIT) { throw "Zapret 2: коммит $head не совпал с закреплённым" }
          Test-Path zapret2/docs/compile/build_howto_windows.txt | Out-Null
          git clone https://github.com/openresty/luajit2 luajit2
          git -C luajit2 checkout --detach $env:LUAJIT_TAG
          $lj = (git -C luajit2 rev-parse HEAD).Trim()
          if ($lj -ne $env:LUAJIT_COMMIT) { throw "LuaJIT: коммит $lj не совпал с закреплённым" }
          git clone https://github.com/basil00/WinDivert windivert-src
          git -C windivert-src checkout --detach $env:WINDIVERT_TAG
          $wd = (git -C windivert-src rev-parse HEAD).Trim()
          if ($wd -ne $env:WINDIVERT_COMMIT) { throw "WinDivert: коммит $wd не совпал с закреплённым" }

      - name: Set up Cygwin (official mirror over https, package signatures checked)
        uses: cygwin/cygwin-install-action@006ad0b0946ca6d0a3ea2d4437677fa767392401 # v4
        with:
          platform: x86_64
          site: https://mirrors.kernel.org/sourceware/cygwin/
          packages: >-
            gcc-core
            make
            zlib-devel
            libintl-devel

      - name: Write build scripts (LF line endings, UTF-8 without BOM)
        shell: pwsh
        run: |
          # Скрипты Bash создаются здесь с явными окончаниями LF: временные файлы шагов Actions
          # на Windows имеют CRLF, и Cygwin Bash читает «\r» как часть команды.
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $common = @'
          set -eo pipefail
          WS="$(cd "$(dirname "$0")/.." && pwd)"
          # Проверка рабочей папки до компиляции.
          case "$WS" in *[[:cntrl:]]*) echo "В пути рабочей папки есть управляющие символы"; exit 1;; esac
          test -d "$WS/zapret2/nfq2" || { echo "Нет папки zapret2/nfq2 в $WS"; exit 1; }
          test -d "$WS/luajit2" || { echo "Нет папки luajit2 в $WS"; exit 1; }
          export MAKEFLAGS=-j$(nproc)
          '@
          $luajit = $common + "`n" + @'
          MINSIZE="-Os -flto=auto -ffunction-sections -fdata-sections"
          LDMINSIZE="-Wl,--gc-sections -flto=auto"
          cd "$WS"
          make -C luajit2 BUILDMODE=static XCFLAGS="-DLUAJIT_USE_SYSMALLOC -DLUAJIT_DISABLE_FFI -ffat-lto-objects" TARGET_CFLAGS="$MINSIZE $CFLAGS" TARGET_LDFLAGS="$LDMINSIZE $LDFLAGS"
          make -C luajit2 install
          '@
          $winws = $common + "`n" + @'
          export CFLAGS="-DZAPRET_GH_VER=ochistka-build -DZAPRET_GH_HASH=$ZAPRET2_COMMIT"
          cd "$WS/zapret2"
          test -f /usr/lib/libintl.a || { echo "Нет /usr/lib/libintl.a (пакет libintl-devel)"; exit 1; }
          make -C nfq2 cygwin64
          test -f nfq2/winws2.exe
          '@
          $collect = $common + "`n" + @'
          cd "$WS"
          mkdir -p output
          cp -a zapret2/nfq2/winws2.exe output/
          cp -a /usr/bin/cygwin1.dll output/
          cygcheck -c cygwin gcc-core make zlib-devel libintl-devel > output/cygwin-packages.txt
          uname -r > output/cygwin-version.txt
          '@
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($pair in @(@('luajit.sh', $luajit), @('winws.sh', $winws), @('collect.sh', $collect))) {
            $text = $pair[1].Replace("`r`n", "`n").Replace("`r", "`n")
            [IO.File]::WriteAllText((Join-Path "$env:GITHUB_WORKSPACE\build" $pair[0]), $text, $utf8)
          }
          # Проверка: в файлах нет CR.
          foreach ($n in 'luajit.sh', 'winws.sh', 'collect.sh') {
            if ([IO.File]::ReadAllText((Join-Path "$env:GITHUB_WORKSPACE\build" $n)).Contains("`r")) { throw "$n содержит CR" }
          }

      - name: Build LuaJIT (static, as in the official build.yml)
        shell: pwsh
        run: |
          $sh = (& C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE\build\luajit.sh").Trim()
          & C:\cygwin\bin\bash.exe $sh
          if ($LASTEXITCODE -ne 0) { throw "LuaJIT: код $LASTEXITCODE" }

      - name: Build winws2.exe (make cygwin64)
        shell: pwsh
        run: |
          $sh = (& C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE\build\winws.sh").Trim()
          & C:\cygwin\bin\bash.exe $sh
          if ($LASTEXITCODE -ne 0) { throw "winws2: код $LASTEXITCODE" }

      - name: Collect Cygwin runtime and package versions
        shell: pwsh
        run: |
          $sh = (& C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE\build\collect.sh").Trim()
          & C:\cygwin\bin\bash.exe $sh
          if ($LASTEXITCODE -ne 0) { throw "Сбор файлов: код $LASTEXITCODE" }

      - name: Get WinDivert 2.2.2 (official release), verify, collect
        shell: pwsh
        env:
          WD_EXPECTED: ${{ inputs.windivert_zip_sha256 }}
        run: |
          $url = 'https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip'
          Invoke-WebRequest -Uri $url -OutFile WinDivert.zip -UseBasicParsing
          $zipHash = (Get-FileHash WinDivert.zip -Algorithm SHA256).Hash.ToLower()
          "WinDivert-2.2.2-A.zip SHA-256: $zipHash" | Tee-Object -FilePath output/windivert-zip-sha256.txt
          $expected = "$env:WD_EXPECTED".Trim().ToLower()
          if ($expected -ne '' -and $expected -ne $zipHash) { throw "SHA-256 архива WinDivert не совпал с ожидаемым" }
          Expand-Archive WinDivert.zip -DestinationPath windivert-bin -Force
          $dll = Get-ChildItem windivert-bin -Recurse -Filter WinDivert.dll | Where-Object { $_.DirectoryName -match '[\\/]x64$' } | Select-Object -First 1
          $sys = Get-ChildItem windivert-bin -Recurse -Filter WinDivert64.sys | Select-Object -First 1
          if (-not $dll -or -not $sys) { throw 'В архиве WinDivert нет x64 WinDivert.dll или WinDivert64.sys' }
          Copy-Item $dll.FullName output/WinDivert.dll
          Copy-Item $sys.FullName output/WinDivert64.sys
          # Подпись драйвера обязана быть действительной (файлы не изменялись).
          $sig = Get-AuthenticodeSignature output/WinDivert64.sys
          "WinDivert64.sys: подпись=$($sig.Status); издатель=$($sig.SignerCertificate.Subject); отпечаток=$($sig.SignerCertificate.Thumbprint)" | Tee-Object -FilePath output/windivert-signature.txt
          if ($sig.Status -ne 'Valid') { throw "Подпись WinDivert64.sys недействительна: $($sig.Status)" }
          $dsig = Get-AuthenticodeSignature output/WinDivert.dll
          "WinDivert.dll: подпись=$($dsig.Status)" | Tee-Object -FilePath output/windivert-signature.txt -Append
          # Лицензии: Zapret 2 (MIT), WinDivert (LGPLv3 / GPLv2), LuaJIT (MIT). Cygwin: см. cygwin.com/licensing.
          Copy-Item zapret2/docs/LICENSE.txt output/LICENSE-zapret2.txt
          Copy-Item windivert-src/LICENSE output/LICENSE-WinDivert.txt
          Copy-Item luajit2/COPYRIGHT output/LICENSE-luajit2.txt

      - name: Verify files, compute SHA-256, write manifest and report
        shell: pwsh
        env:
          WD_EXPECTED: ${{ inputs.windivert_zip_sha256 }}
        run: |
          $required = 'winws2.exe', 'cygwin1.dll', 'WinDivert.dll', 'WinDivert64.sys'
          foreach ($f in $required) { if (-not (Test-Path "output/$f")) { throw "Нет файла $f" } }
          $files = foreach ($f in $required) {
            $item = Get-Item "output/$f"
            [pscustomobject]@{ name = $f; size = $item.Length; sha256 = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower() }
          }
          $verified = ("$env:WD_EXPECTED".Trim() -ne '')
          $manifest = [pscustomobject]@{
            zapret2_commit = $env:ZAPRET2_COMMIT; luajit_tag = $env:LUAJIT_TAG; luajit_commit = $env:LUAJIT_COMMIT
            windivert_tag = $env:WINDIVERT_TAG; windivert_commit = $env:WINDIVERT_COMMIT
            windivert_zip_sha256_checked_against_input = $verified
            note = 'Хэши этой сборки. Закреплять в OCHISTKA только после проверки владельцем; сборка не подписана.'
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content output/manifest.json -Encoding utf8
          $report = "## Сборка winws2.exe`n`n| Файл | Размер | SHA-256 |`n|---|---|---|`n"
          foreach ($f in $files) { $report += "| $($f.name) | $($f.size) | $($f.sha256) |`n" }
          $report += "`nZapret 2: $env:ZAPRET2_COMMIT; LuaJIT: $env:LUAJIT_TAG; WinDivert: $env:WINDIVERT_TAG`n"
          $report += "`nАрхив WinDivert сверен с ожидаемым SHA-256: $verified`n"
          $report | Tee-Object -FilePath output/REPORT.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zapret2-winws2-windows-x64
          path: output/
          if-no-files-found: error
