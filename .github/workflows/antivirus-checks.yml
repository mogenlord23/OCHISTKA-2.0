name: antivirus-checks

on:
  workflow_dispatch:
  push:
    branches: [codex/viruses-computer-scan]
    paths:
      - .github/workflows/antivirus-checks.yml
      - crates/ochistka-core/src/scan.rs
      - crates/platform/**
      - apps/desktop/src-tauri/src/commands.rs

permissions:
  contents: read

concurrency:
  group: antivirus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antivirus-tests:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install interface dependencies
        run: npm ci
      - name: Windows file API experiments
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/quarantine-probes/windows_probe.py
      - name: macOS file API experiments
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: python3 tools/quarantine-probes/macos_probe.py
      - name: Windows local IPC experiment
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/quarantine-probes/ipc_probe.py
      - name: macOS local IPC experiment
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: python3 tools/quarantine-probes/ipc_probe.py
      - name: Check scan logic
        run: cargo test --locked -p ochistka-core scan::tests
      - name: Check quarantine logic
        run: cargo test --locked -p ochistka-core quarantine::tests
      - name: Check Linux file identity
        if: runner.os == 'Linux'
        run: cargo test --locked -p ochistka-platform linux::file_identity::tests
      - name: Check Linux quarantine race experiments
        if: runner.os == 'Linux'
        run: cargo test --locked -p ochistka-platform --test quarantine_races
      - name: Check filesystem scan integration
        run: cargo test --locked -p ochistka-platform --test virus_scan
      - name: Check scan interface
        run: npm test -w apps/desktop -- src/components/VirusesPage.test.ts src/lib/api.test.ts --reporter=dot
      - name: Check interface types
        run: npm run check -w apps/desktop

  unix-antivirus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclamav-dev clamav-freshclam pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          test -d /etc/clamav/certs
      - name: Install native libraries on macOS
        if: runner.os == 'macOS'
        run: brew install clamav pkgconf
      - name: Require native ClamAV
        run: pkg-config --atleast-version=1.4 libclamav
      - name: Check local volumes and ONNX
        run: |
          cargo test --locked -q -p ochistka-platform --lib computer_scan
          cargo test --locked -q -p ochistka-platform --lib pe_model
      - name: Check the linked scanner
        run: cargo test --locked -q -p ochistka-platform --features libclamav --test virus_scan
      - name: Compile desktop commands
        run: cargo check --locked -q -p ochistka-desktop
