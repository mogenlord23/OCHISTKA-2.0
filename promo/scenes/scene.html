<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>scene</title>
<style>
:root{--black:#080808;--ink:#fafafa;--soft:#d4d4d4;--muted:#8b8b8b;--surface:#141414;--border:#343434;--orange:#ff7a00;--green:#b4ff00;--blue:#147cff;--violet:#cf00ff;--pink:#ff009d}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--black);font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 700px at 50% 62%,#1c1c1c 0%,#080808 70%)}
#stage.light{background:linear-gradient(#fdfdfd,#cfcfcf);color:#111}
#grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at 50% 60%,#000,transparent 75%)}
.light #grid{display:none}
#title{position:absolute;left:0;right:0;top:150px;text-align:center;font:800 92px/1.1 "Inter Display","Inter",sans-serif;letter-spacing:-2px;padding:0 60px}
#title b{color:var(--orange)}
.light #title b{color:var(--orange)}
#phone{position:absolute;left:110px;top:400px;width:860px;height:1260px;border-radius:70px;background:#0d0d0d;border:2px solid #2c2c2c;box-shadow:0 60px 140px #000c,0 0 0 10px #0b0b0b;overflow:hidden}
#phone .bar{display:flex;justify-content:space-between;align-items:center;padding:34px 44px;color:var(--muted);font-size:26px}
#phone .bar i{width:230px;height:16px;border-radius:9px;background:#1b1b1b;display:block}
#screen{padding:0 40px}
.h{font:700 40px "Inter Display",Inter;margin:18px 0 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:30px;margin-bottom:22px}
.row{display:flex;align-items:center;gap:22px;font-size:32px}
.row .n{flex:1}.row .v{color:var(--muted);font-size:28px}
.track{height:18px;border-radius:9px;background:#222;overflow:hidden;flex:1}
.fill{height:100%;border-radius:9px}
.pill{display:inline-block;padding:10px 22px;border-radius:30px;font-size:26px;font-weight:700}
.emo{position:absolute;width:210px;height:210px;filter:drop-shadow(0 30px 40px #000a)}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ff9a2e,#ff009d);box-shadow:0 40px 90px #0006}.tile img{width:62%;height:62%}#logo{left:340px;top:520px;width:400px;height:400px;border-radius:90px}
#brand{position:absolute;left:0;right:0;top:960px;text-align:center;font:800 150px/1 "Inter Display",Inter;letter-spacing:-6px}
#sub{position:absolute;left:0;right:0;top:1130px;text-align:center;font:700 64px Inter;color:#555}
#qr{position:absolute;left:340px;top:900px;width:400px;height:400px;background:#fff;border-radius:36px;padding:28px;box-shadow:0 40px 90px #000a}
#url{position:absolute;left:0;right:0;top:1360px;text-align:center;font:800 70px Inter;color:#111}
#sub2{position:absolute;left:0;right:0;top:1470px;text-align:center;font:600 44px Inter;color:#666}
#hook-bar{position:absolute;left:150px;top:1180px;width:780px}
</style></head><body><div id="stage"><div id="grid"></div><div id="title"></div><div id="content"></div></div>
<script src="qr.js"></script>
<script>
const TL = window.TIMELINE;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const E=n=>`../assets/emoji/${n}.png`;
const params=new URLSearchParams(location.search);
const sc=TL.find(s=>s.id===params.get('scene'));
const dur=sc.end-sc.start;
const stage=document.getElementById('stage'),title=document.getElementById('title'),content=document.getElementById('content');
title.innerHTML=sc.title.replace(sc.accent,`<b>${sc.accent}</b>`);
if(sc.id==='logo'||sc.id==='cta')stage.classList.add('light');
const imgs=[];
function img(src,cls,style){const i=new Image();i.src=src;i.className=cls||'';if(style)i.style.cssText=style;imgs.push(i);content.appendChild(i);return i}
function el(html){const d=document.createElement('div');d.innerHTML=html;const e=d.firstElementChild;content.appendChild(e);return e}
function phone(inner,tabs){return el(`<div id="phone"><div class="bar"><span>OCHISTKA</span><i></i><span>демо</span></div><div id="screen">${inner}</div></div>`)}
const U={};
// ---- scenes ----
if(sc.id==='hook'){
  title.style.top='260px';title.style.fontSize='150px';
  U.e=[img(E('rocket'),'emo','left:90px;top:760px;width:320px;height:320px'),img(E('wastebasket'),'emo','left:690px;top:900px;width:300px;height:300px'),img(E('broom'),'emo','left:380px;top:1180px;width:340px;height:340px'),img(E('sparkles'),'emo','left:760px;top:560px;width:200px;height:200px')];
  U.bar=el(`<div id="hook-bar"><div class="card"><div class="row"><span class="n">Загрузка…</span><span class="v" id="pc">12%</span></div><div class="track" style="margin-top:20px"><div class="fill" id="hf" style="background:var(--orange);width:12%"></div></div></div></div>`);
  U.bar.style.top='1560px';
}
if(sc.id==='logo'){U.logo=el(`<div class="tile" id="logo"><img src="../assets/emoji/broom.png"></div>`);imgs.push(U.logo.firstChild);U.brand=el(`<div id="brand">OCHISTKA</div>`);U.sub=el(`<div id="sub">чистый ПК за минуту</div>`);U.e=[img(E('sparkles'),'emo','left:110px;top:430px'),img(E('shield'),'emo','left:760px;top:1300px')];title.style.display='none'}
if(sc.id==='viruses'){
  U.p=phone(`<div class="h">Проверка</div><div class="card"><div class="row"><span class="n">Сканирование</span><span class="v" id="vp">0%</span></div><div class="track" style="margin-top:22px"><div class="fill" id="vf" style="background:var(--green);width:0"></div></div><div class="v" id="vf2" style="margin-top:18px;color:var(--muted);font-size:26px">C:\\Users\\Загрузки\\setup.exe</div></div>
  <div class="h" style="font-size:34px">Находки <span id="vc" class="pill" style="background:#ff009d33;color:var(--pink)">0</span></div>
  <div id="finds"></div><div class="card" style="text-align:center;font-weight:700;font-size:32px;background:var(--green);color:#080808;border:0" id="qbtn">Удалить через карантин</div>`);
  U.finds=[['invoice.pdf.exe','двойное расширение'],['crack_setup.exe','исполняемый в загрузках'],['update_tool.scr','подозрительное имя']];
  U.e=[img(E('shield'),'emo','left:760px;top:330px;width:260px;height:260px')];
}
if(sc.id==='processes'){
  const rows=[['chrome.exe',48,'var(--blue)'],['video_render.exe',72,'var(--orange)'],['teams.exe',22,'var(--blue)'],['backup_svc',9,'var(--green)'],['explorer.exe',6,'var(--green)']];
  U.rows=rows;
  U.p=phone(`<div class="h">Процессы</div>${rows.map((r,i)=>`<div class="card"><div class="row"><span class="n">${r[0]}</span><span class="v" id="pv${i}">0%</span></div><div class="track" style="margin-top:18px"><div class="fill" id="pf${i}" style="background:${r[2]};width:0"></div></div></div>`).join('')}`);
  U.e=[img(E('lightning'),'emo','left:770px;top:330px;width:240px;height:240px')];
}
if(sc.id==='hardware'){
  const tiles=[['CPU','Процессор','var(--blue)'],['GPU','Видеокарта','var(--violet)'],['RAM','Память','var(--green)']];
  U.tiles=tiles;
  U.p=phone(`<div class="h">Комплектующие</div>${tiles.map((t,i)=>`<div class="card"><div class="row"><span class="n">${t[0]} · ${t[1]}</span><span class="v" id="hv${i}">0%</span></div><svg id="hs${i}" viewBox="0 0 700 150" width="740" height="150" style="margin-top:14px"><polyline fill="none" style="stroke:${t[2]}" stroke-width="6" stroke-linejoin="round" points="" /></svg></div>`).join('')}`);
  U.e=[img(E('sparkles'),'emo','left:780px;top:330px;width:230px;height:230px')];
}
if(sc.id==='boost'){
  U.p=phone(`<div class="h">Boost</div><div class="card" style="text-align:center;padding:50px"><div style="font:800 190px/1 Inter" id="bv">87%</div><div class="v" style="margin-top:10px">нагрузка системы</div></div>
  <div class="card" id="bb" style="text-align:center;font-weight:800;font-size:46px;background:var(--orange);color:#080808;border:0;padding:46px">Ускорить</div>
  <div class="card"><div class="row"><span class="n">Автозагрузка</span><span class="v" id="b1">12 программ</span></div></div>
  <div class="card"><div class="row"><span class="n">Режим питания</span><span class="v">можно откатить</span></div></div>`);
  U.e=[img(E('rocket'),'emo','left:740px;top:300px;width:280px;height:280px')];
}
if(sc.id==='cta'){
  U.logo=el(`<div class="tile" style="left:440px;top:360px;width:200px;height:200px;border-radius:46px"><img src="../assets/emoji/broom.png"></div>`);imgs.push(U.logo.firstChild);
  const n=window.QR.length,cell=344/n;let s=`<svg viewBox="0 0 ${n} ${n}" width="344" height="344" shape-rendering="crispEdges">`;
  window.QR.forEach((r,y)=>r.forEach((v,x)=>{if(v)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#080808"/>`}));
  U.qr=el(`<div id="qr">${s}</svg></div>`);U.url=el(`<div id="url">ochistka.app</div>`);U.sub=el(`<div id="sub2">скачай с сайта · демо-версия</div>`);
  U.e=[img(E('broom'),'emo','left:60px;top:1500px'),img(E('sparkles'),'emo','left:800px;top:1520px')];
}
// ---- animation ----
function seek(t){
  t=clamp(t,0,dur);
  const fadeOut=1-clamp((t-(dur-0.25))/0.25)*1;
  stage.style.opacity=clamp(t/0.001+0.0,0,1)*0+fadeOut;
  const ti=back(t/0.55);title.style.transform=`translateY(${(1-ti)*90}px)`;title.style.opacity=clamp(t/0.3);
  if(U.p){const k=ease((t-0.15)/0.7);U.p.style.transform=`translateY(${(1-k)*260}px) scale(${0.94+0.06*k})`;U.p.style.opacity=clamp(k*1.4)}
  (U.e||[]).forEach((e,i)=>{const k=back((t-0.3-i*0.15)/0.6);e.style.opacity=clamp(k*2);e.style.transform=`translateY(${Math.sin(t*2.2+i*1.7)*18}px) rotate(${Math.sin(t*1.6+i)*7}deg) scale(${0.3+0.7*clamp(k,0,1.2)})`});
  const g=id=>document.getElementById(id);
  if(sc.id==='hook'){const p=Math.round(12+Math.floor(t*3)*2.5);g('pc').textContent=Math.min(p,38)+'%';g('hf').style.width=Math.min(p,38)+'%';U.bar.style.opacity=ease(t/0.6)}
  if(sc.id==='logo'){const k=back((t-0.1)/0.7);U.logo.style.transform=`scale(${k}) rotate(${(1-clamp(k))*-12}deg)`;U.logo.style.opacity=clamp(k*2);const b=ease((t-0.6)/0.6);U.brand.style.opacity=b;U.brand.style.transform=`translateY(${(1-b)*60}px)`;const s=ease((t-1.2)/0.6);U.sub.style.opacity=s;U.sub.style.transform=`translateY(${(1-s)*40}px)`}
  if(sc.id==='viruses'){const p=clamp((t-0.8)/3);const pc=Math.round(p*100);g('vp').textContent=pc+'%';g('vf').style.width=pc+'%';
    const names=['setup.exe','invoice.pdf.exe','photo.zip','crack_setup.exe','update_tool.scr','notes.txt'];g('vf2').textContent='C:\\Users\\Загрузки\\'+names[Math.min(5,Math.floor(p*6))];
    let h='',c=0;U.finds.forEach((f,i)=>{const k=clamp((t-1.6-i*0.9)/0.4);if(k>0){c++;h+=`<div class="card" style="opacity:${k};transform:translateX(${(1-ease(k))*60}px);padding:22px 30px"><div class="row"><span class="n">${f[0]}</span><span class="v">${f[1]}</span></div></div>`}});
    g('finds').innerHTML=h;g('vc').textContent=c;g('qbtn').style.opacity=ease((t-3.9)/0.5);}
  if(sc.id==='processes'){U.rows.forEach((r,i)=>{const k=ease((t-0.5-i*0.2)/0.9);const v=Math.round(r[1]*k+(r[1]>40?Math.sin(t*3+i)*3*k:0));g('pv'+i).textContent=v+'%';g('pf'+i).style.width=v+'%'});}
  if(sc.id==='hardware'){U.tiles.forEach((tt,i)=>{const w=ease((t-0.5-i*0.2)/0.6);let pts='';const N=40;for(let x=0;x<N;x++){const xx=x/(N-1)*700;const tm=t*3+x*0.35+i*2;const y=75-Math.sin(tm)*30-Math.sin(tm*2.3+i)*18;pts+=`${xx},${(75+(y-75)*w).toFixed(1)} `}
    g('hs'+i).firstElementChild.setAttribute('points',pts);g('hv'+i).textContent=Math.round((38+i*14+Math.sin(t*3+i)*6)*w)+'%'});}
  if(sc.id==='boost'){const k=ease((t-1.5)/1.6);g('bv').textContent=Math.round(87-60*k)+'%';g('bv').style.color=k>0.5?'var(--green)':'var(--orange)';g('b1').textContent=Math.round(12-8*k)+' программ';g('bb').style.transform=`scale(${1-0.04*Math.sin(clamp((t-1.2)/0.4)*Math.PI)})`;g('bb').textContent=k>0.95?'Готово ✓':'Ускорить'}
  if(sc.id==='cta'){const q=back((t-0.4)/0.7);U.qr.style.transform=`scale(${q})`;U.qr.style.opacity=clamp(q*2);const u=ease((t-1.0)/0.5);U.url.style.opacity=u;U.url.style.transform=`translateY(${(1-u)*40}px)`;U.sub.style.opacity=ease((t-1.4)/0.5);U.logo.style.opacity=ease(t/0.5);U.qr.style.boxShadow=`0 0 ${40+30*Math.sin(t*3)}px #ff7a0066, 0 40px 90px #000a`}
}
window.seek=seek;
window.sceneReady=Promise.all(imgs.map(i=>i.decode?i.decode():Promise.resolve())).then(()=>document.fonts.ready).then(()=>seek(0));
</script></body></html>
